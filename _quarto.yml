project:
  type: book
  output-dir: docs

# The table of contents lives in the profiles: _quarto-web.yml (the site,
# used by default) and _quarto-pdf.yml (the PDF edition, main chapters only)
profile:
  default: web

# Re-execute code only when a .qmd file changes; stored results live in _freeze/
# (commit _freeze/ so that the site can be rebuilt without running Python)
execute:
  freeze: auto

book:
  title: "Engineering Mathematics"
  site-url: https://seoultechpse.github.io/EngMath/
  author: "Kee-Youn Yoo"
  date: "11/01/2026"
  search: true
  sidebar:
    logo: assets/psl-logo-compact.svg
    logo-href: https://seoultechpse.github.io/   # PSL home
    logo-alt: "PSL home"
    tools:
      - icon: file-earmark-pdf
        href: files/Engineering-Mathematics.pdf
        aria-label: "PDF edition"
  cover-image: SeoulTech.png

# bibliography: references.bib

format:
  html:
    theme: cosmo
    css: assets/site.css
